    <link rel="stylesheet" href="/src/index.css" />
    <style id="theimpart-critical-css">
      html {
        background-color: #ffffff;
        color: #000000;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        background-color: #ffffff;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #222222;
        color: #cbcbcb;
        color-scheme: dark;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
    <script>
      (function() {
        try {
          localStorage.removeItem('the_impart_theme_v1');
          var p = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
          if (
            p === '/admin' || p.indexOf('/admin/') === 0 ||
            p === '/login' || p.indexOf('/login/') === 0 ||
            p === '/editor' || p.indexOf('/editor/') === 0
          ) {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            var saved = localStorage.getItem('the_impart_theme_v2');
            if (saved === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'dark');
            } else {
              // Світла (біла) тема є основною за замовчуванням
              document.documentElement.classList.remove('dark');
              document.documentElement.setAttribute('data-theme', 'light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-black dark:bg-[#222222] dark:text-[#cbcbcb]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
